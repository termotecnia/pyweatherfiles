[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pytmy"
version = "0.0.0"
description = "A generator for Typical Meteorological Year (TMY) files."
readme = "README.md"
authors = [
  { name = "Daniel Sanchez Garcia", email = "dsahcnez.garcia@example.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "matplotlib",
    "openpyxl"
]
requires-python = ">=3.7"

[project.urls]
"Homepage" = "https://github.com/dsanchez-garcia/pytmy"
"Bug Tracker" = "https://github.com/dsanchez-garcia/pytmy/issues"
