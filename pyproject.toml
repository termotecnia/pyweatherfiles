[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyweatherfiles"
version = "0.1.0"
description = "A generator for Typical Meteorological Year (TMY) files and weather data management."
readme = "README.md"
authors = [
  { name = "Daniel Sánchez-García", email = "daniel.sanchezgarcia@uca.es" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "matplotlib",
    "openpyxl"
]
requires-python = ">=3.7"

[project.urls]
"Homepage" = "https://github.com/dsanchez-garcia/pyweatherfiles"
"Bug Tracker" = "https://github.com/dsanchez-garcia/pyweatherfiles/issues"