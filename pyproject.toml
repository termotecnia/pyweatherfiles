[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyweatherfiles"
version = "0.0.1"
description = "A generator for Typical Meteorological Year (TMY) files and weather data management."
readme = "README.md"
license = "MIT"
authors = [
  { name = "Daniel Sánchez-García", email = "daniel.sanchezgarcia@uca.es" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]
dependencies = [
    "pandas",
    "numpy",
    "scipy",
    "matplotlib",
    "seaborn",
    "openpyxl",
    "ladybug-core",
    "pyyaml"
]
# NOTE: bumped from the previous ">=3.7" (EOL since 2023-06, and no longer
# installable with the pinned dependencies above — e.g. modern pandas/numpy
# require >=3.9/3.10). See INFORME_REVISION_GENERAL.md §6 Fase 3.
requires-python = ">=3.10"

[project.optional-dependencies]
# NOTE: sphinx-rtd-theme is pinned to >=3.1 on purpose: releases 3.0.x and
# earlier declare `sphinx<9`, so pip would silently downgrade Sphinx (or fail to
# resolve) on a fresh environment. 3.1.0 is the first release compatible with
# Sphinx 9.x, which is what the local and Read the Docs builds use.
docs = [
    "sphinx>=7.0",
    "myst-nb>=1.0",
    "sphinx-rtd-theme>=3.1",
]
# Optional runtime extras: each corresponds to imports already guarded with
# try/except ImportError in the relevant module (see AGENTS.md / README.md
# §11 "Complete dependencies by module").
climate = [
    "pvlib",           # pyweatherfiles.climate_processor (clear-sky gap-filling)
]
comparator = [
    "tabulate",         # pyweatherfiles.epw_comparator (console report formatting)
]
energyplus = [
    "besos",            # pyweatherfiles.degree_hours (IDF setpoint/schedule parsing)
    "eppy",             # fallback IDF parser used by degree_hours if besos is unavailable
]
accents = [
    "accim",            # pyweatherfiles.degree_hours (optional accent-sanitization of IDF paths)
]
full = [
    "pyweatherfiles[climate,comparator,energyplus,accents]",
]
test = [
    "pytest>=7.0",
    "pytest-cov",
]

[project.urls]
"Homepage" = "https://github.com/termotecnia/pyweatherfiles"
"Bug Tracker" = "https://github.com/termotecnia/pyweatherfiles/issues"
"Documentation" = "https://pyweatherfiles.readthedocs.io/"

[tool.setuptools.packages.find]
include = ["pyweatherfiles*"]
exclude = ["onedrive_backup*", "examples*", "analysis_scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
