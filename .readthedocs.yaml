# Read the Docs configuration file for `pyweatherfiles`.
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details.
version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

# Point directly at the Sphinx config; the source directory (docs/source/)
# is inferred from its location.
sphinx:
  configuration: docs/source/conf.py
  # Keep builds resilient to docstring/formatting nits in third-party-facing
  # code; warnings are still printed in the build log for review.
  fail_on_warning: false

# Install the package itself (so autodoc can `import pyweatherfiles`) together
# with the documentation toolchain (Sphinx, myst-nb, sphinx-rtd-theme) declared
# under the "docs" extra in pyproject.toml.
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

