name: CI

# Runs the test suite (and, on success, a package-build sanity check) on
# every push to `main` and on every pull request, across a small matrix of
# currently-supported Python versions (see INFORME_REVISION_GENERAL.md §6,
# Fase 3). Windows is included (with a single representative Python version)
# because real development happens on Windows and this repo has already hit
# at least one Windows-only bug before (a UnicodeEncodeError from console
# output on the cp1252 code page, fixed per TODO.md task 3).

on:
  push:
    branches: ["main"]
  pull_request:

# Cancel older in-progress runs for the same branch/PR when new commits land.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Force a non-interactive matplotlib backend; several modules import
  # matplotlib.pyplot and CI runners have no display server.
  MPLBACKEND: Agg

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # Windows is the primary real-world development platform for this
          # repo; one representative version is enough to catch
          # Windows-specific regressions without doubling CI time/cost.
          - os: windows-latest
            python-version: "3.12"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install package with test extras
        # The "comparator" extra (tabulate) is installed on purpose: unlike the
        # other optional dependencies, `pyweatherfiles.epw_comparator` raises
        # ImportError at import time when tabulate is missing, so without it
        # tests/test_epw_comparator.py aborts collection (pytest exit code 2)
        # and the whole suite never runs. The heavier optional extras
        # (climate/energyplus/accents) stay out; their tests skip themselves.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test,comparator]"

      - name: Run test suite
        run: python -m pytest tests/ -v --cov=pyweatherfiles --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  build:
    name: Build package (sdist + wheel)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

